services:
  - type: web
    name: hotel-marias
    env: python
    buildCommand: |
      pip install -r requirements.txt
      cd frontend && npm install && npm run build
      cd ../backend && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: cd backend && gunicorn backend.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: DEBUG
        value: False
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        sync: false